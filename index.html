  S.list.forEach(function(g){if(g.role!=="member"&&g.members.length&&typeof g.members[0]==="string"){g.members=g.members.map(function(n){return{name:n,amt:g.amount}});g.turns=g.members.map(function(m,i){return[i]})}})}
function migrate(){S.list.forEach(function(g){if(g.role==="member")return;if(!g.shares)g.shares=g.turns.map(function(t){return t.map(function(){return Math.round(pot(g)/t.length*100)/100})});if(!g.end)g.end=iso(addP(g.start,g.freq,g.turns.length-1))})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.list))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nf(n){return Number(n).toLocaleString("ar-EG",{maximumFractionDigits:2})}
function money(n){return ST.hide&&!S.pdf?"•••• ج":nf(n)+" ج"}
function get(){return S.list.find(function(g){return g.id===S.id})}
function pot(g){return g.members.reduce(function(s,m){return s+m.amt},0)}
function shareOf(g,r,k){return g.shares&&g.shares[r]&&g.shares[r][k]!=null?g.shares[r][k]:Math.round(pot(g)/g.turns[r].length*100)/100}
function names(g,r){return g.turns[r].map(function(i){return g.members[i].name}).join(" + ")}
function dueDate(g,r){return addP(g.start,g.freq,r)}
function fmt(d){return d.toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"})}
function paidCount(g,r){var c=0;g.members.forEach(function(m,i){if(g.paid[r+"-"+i])c++});return c}
function paidSum(g,r){var c=0;g.members.forEach(function(m,i){if(g.paid[r+"-"+i])c+=m.amt});return c}
function nR(g){return g.role==="member"?g.R:g.turns.length}
function curRound(g){var t=new Date();t.setHours(0,0,0,0);var c=0;for(var r=0;r<nR(g);r++){if(dueDate(g,r)<=t)c=r}return c}
function go(v,id){S.view=v;S.edited=false;S.editId=null;if(v==="new")initForm(null);if(v==="newm")initMF(null);if(v==="wtx")initTF(null);if(id!==undefined){S.id=id;var g=get();S.round=g?curRound(g):null}render();window.scrollTo(0,0)}

function avatar(n){var c=["#0B6E7F","#7A5BA6","#A86A0C","#2F7D4F","#B04A5A","#3D63B8"],k=0;for(var i=0;i<n.length;i++)k+=n.charCodeAt(i);return'<span class="av" style="background:'+c[k%6]+'">'+esc(n.trim().charAt(0))+'</span>'}
function shortDate(d){return d.toLocaleDateString("ar-EG",{day:"numeric",month:"short"})}
function ring(pct,size){var r=size/2-6,c=2*Math.PI*r;return'<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="نسبة التحصيل '+pct+'٪"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(var(--gr),.18)" stroke-width="7"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c*pct/100+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="17">'+nf(pct)+'٪</text></svg>'}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.className="show";setTimeout(function(){e.className=""},1800)}

function nextUnpaid(g){for(var i=0;i<g.R;i++){if(!g.paid[i])return i}return -1}
function dueNow(g){var c=curRound(g),s=0;for(var i=0;i<=c;i++){if(!g.paid[i])s+=g.myAmt}return s}
function homeCardM(g){
  var R=g.R,pc=0,t=new Date();t.setHours(0,0,0,0);for(var i=0;i<R;i++){if(g.paid[i])pc++}
  var nu=nextUnpaid(g),od=nu>-1&&dueDate(g,nu)<t;
  return'<button class="card bcard" onclick="go(\'detail\',\''+g.id+'\')"><div class="row"><span class="chip"></span><span class="pill">مشترك</span></div>'
  +'<div class="bl">قسطي في كل دور</div><div class="bam">'+money(g.myAmt)+'</div><h2>'+esc(g.name)+'</h2>'
  +'<div class="muted">'+(g.manager?'المسؤول: '+esc(g.manager)+' · ':'')+(g.freq==="weekly"?"أسبوعي":"شهري")+' · '+nf(R)+' دور</div>'
  +'<div class="g3"><div><b>'+money(pc*g.myAmt)+'</b><span>دفعته</span></div><div><b>'+money((R-pc)*g.myAmt)+'</b><span>المتبقي عليّ</span></div><div><b>'+money(g.recv)+'</b><span>هستلم</span></div></div>'
  +'<div class="bar"><i style="width:'+(pc/R*100)+'%"></i></div>'
  +'<div class="row" style="margin-top:14px"><span class="muted">'+(nu<0?'<span class="pill ok">كل الأقساط مدفوعة</span>':'القسط القادم: <b style="color:var(--ink)">'+fmt(dueDate(g,nu))+'</b>'+(od?' <span class="pill warn">متأخر</span>':''))+'</span><span class="muted">دوري: '+nf(g.myRound+1)+' · '+shortDate(dueDate(g,g.myRound))+'</span></div></button>';
}
function home(){
  var h=tabsHTML("home"),tot=0,got=0,due=0,mg=0;
  S.list.forEach(function(g){if(g.role==="member"){due+=dueNow(g)}else{mg++;var r=curRound(g);tot+=pot(g);got+=paidSum(g,r)}});
  if(S.list.length){
    h+='<section class="hero"><div class="hl">'+(mg?'المتبقي تحصيله في الدور الحالي':'المستحق عليّ لحد النهارده')+'</div><div class="big">'+money(mg?tot-got:due)+'</div>'
    +(mg?'<div class="bar"><i style="width:'+(tot?got/tot*100:0)+'%"></i></div>':'')
    +'<div class="hstats"><div><b>'+nf(S.list.length)+'</b><span>جمعيات</span></div><div><b>'+money(got)+'</b><span>تم تحصيله</span></div><div><b>'+money(due)+'</b><span>مستحق عليّ</span></div></div></section>';
  }
  h+='<div class="sec"><span>جمعياتك</span>'+(S.list.length?'<button class="linkbtn" style="margin:0" onclick="exportPdf(\'all\')">'+PDFI+' PDF لكل الجمعيات</button>':'')+'</div>';
  if(!S.list.length){h+='<div class="empty"><h2>مفيش جمعيات لسه</h2><p style="margin:0">اضغط «جمعية جديدة»، واختار إنك مسؤول عنها أو مشترك فيها.</p></div>'}
  S.list.forEach(function(g){
    if(g.role==="member"){h+=homeCardM(g);return}
    var r=curRound(g),p=pot(g),ps=paidSum(g,r),done=ps>=p;
    h+='<button class="card bcard" onclick="go(\'detail\',\''+g.id+'\')"><div class="row"><span class="chip"></span><span><span class="pill">مسؤول</span> <span class="pill '+(done?'ok':'warn')+'">'+(done?'الدور مكتمل':'جاري التحصيل')+'</span></span></div>'
    +'<div class="bl">قيمة الدور</div><div class="bam">'+money(p)+'</div><h2>'+esc(g.name)+'</h2>'
    +'<div class="muted">الدور '+nf(r+1)+' من '+nf(g.turns.length)+' · '+fmt(dueDate(g,r))+' · '+(g.freq==="weekly"?"أسبوعي":"شهري")+'</div>'
    +'<div class="g3"><div><b>'+nf(g.members.length)+'</b><span>أعضاء</span></div><div><b>'+money(ps)+'</b><span>المحصّل</span></div><div><b>'+money(p-ps)+'</b><span>المتبقي</span></div></div>'
    +'<div class="bar"><i style="width:'+(ps/p*100)+'%"></i></div>'
    +'<div class="row" style="margin-top:14px;justify-content:flex-start">'+avatar(g.members[g.turns[r][0]].name)+'<span class="muted">المستلم: <b style="color:var(--ink)">'+esc(names(g,r))+'</b></span></div></button>';
  });
  return h+'<button class="primary fab" onclick="go(\'choose\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>جمعية جديدة</button>';
}
function chooseView(){
  return'<div class="top"><button class="ghost" onclick="go(\'home\')">رجوع</button></div><h1>جمعية جديدة</h1><p class="sub">إنت إيه في الجمعية دي؟</p>'
  +'<button class="card bcard" onclick="go(\'new\')"><span class="chip"></span><h2 style="margin-top:14px">أنا المسؤول</h2><p class="muted" style="margin:4px 0 0">بدير الجمعية: بجمع الأقساط من الأعضاء وبوزّع المبالغ وبتابع مين دفع.</p></button>'
  +'<button class="card bcard" onclick="go(\'newm\')"><span class="chip"></span><h2 style="margin-top:14px">أنا مشترك</h2><p class="muted" style="margin:4px 0 0">مشترك في جمعية حد تاني بيديرها، وعايز أتابع أقساطي وموعد دوري.</p></button>';
}
/* member (participant) form */
function initMF(g){
  var today=new Date().toISOString().slice(0,10);
  S.mf=g?{name:g.name,manager:g.manager||"",freq:g.freq,start:g.start,end:g.end,amt:String(g.myAmt),round:g.myRound,recv:String(g.recv),re:true}
        :{name:"",manager:"",freq:"monthly",start:today,end:iso(addP(today,"monthly",3)),amt:"",round:0,recv:"",re:false};
}
function editMember(){initMF(get());S.view="newm";S.editId=S.id;render();window.scrollTo(0,0)}
function warnHTML(){
  var f=S.mf,per=periods(f.start,f.end,f.freq),a=+digits(f.amt),r=+digits(f.recv);
  if(per.ok&&a>0&&r>0&&Math.abs(a*per.R-r)>0.01)return'<div class="note warn">المبلغ اللي هتستلمه ('+nf(r)+') مختلف عن مجموع اللي هتدفعه ('+nf(a)+' × '+nf(per.R)+' = '+nf(a*per.R)+'). لو ده متفق عليه مفيش مشكلة، وإلا راجع المسؤول.</div>';
  return'';
}
function mplanHTML(){
  var f=S.mf,per=periods(f.start,f.end,f.freq);
  if(!per.ok)return'<div class="note bad">'+esc(per.msg)+'</div>';
  var R=per.R;if(f.round>=R)f.round=R-1;
  var h='<div class="note ok">المدة بتتقسم على '+nf(R)+(f.freq==="weekly"?' دور أسبوعي':' دور شهري')+'، يعني هتدفع '+nf(R)+' مرة.</div>'
  +'<label for="mr">دوري في الاستلام</label><select id="mr" onchange="S.mf.round=+this.value">';
  for(var i=0;i<R;i++)h+='<option value="'+i+'"'+(i===f.round?' selected':'')+'>الدور '+nf(i+1)+' — '+fmt(addP(f.start,f.freq,i))+'</option>';
  return h+'</select><label for="mv">المبلغ اللي هستلمه (ج)</label><input id="mv" inputmode="decimal" value="'+esc(f.recv)+'" oninput="setRecv(this.value)"><div id="mwarn">'+warnHTML()+'</div>';
}
function refreshM(){
  var f=S.mf;if(!f.re){var per=periods(f.start,f.end,f.freq),a=+digits(f.amt);f.recv=per.ok&&a>0?String(Math.round(a*per.R*100)/100):""}
  document.getElementById("mplan").innerHTML=mplanHTML();
}
function setMF(k,v){S.mf[k]=v;refreshM()}
function setRecv(v){S.mf.recv=v;S.mf.re=true;document.getElementById("mwarn").innerHTML=warnHTML()}
function newMForm(){
  var g=S.editId?get():null,f=S.mf;
  return'<div class="top"><button class="ghost" onclick="'+(g?"go('detail','"+g.id+"')":"go('choose')")+'">رجوع</button></div><h1>'+(g?'تعديل الجمعية':'جمعية أنا مشترك فيها')+'</h1>'
  +'<label for="n">اسم الجمعية</label><input id="n" value="'+esc(f.name)+'" oninput="S.mf.name=this.value" placeholder="مثال: جمعية الشغل">'
  +'<label for="mg">اسم المسؤول (اختياري)</label><input id="mg" value="'+esc(f.manager)+'" oninput="S.mf.manager=this.value" placeholder="مثال: أبو محمد">'
  +'<label for="f">القبض كل</label><select id="f" onchange="setMF(\'freq\',this.value)"><option value="monthly"'+(f.freq==="monthly"?' selected':'')+'>شهر</option><option value="weekly"'+(f.freq==="weekly"?' selected':'')+'>أسبوع</option></select>'
  +'<div class="two"><div><label for="d">تاريخ البداية (أول دور)</label><input id="d" type="date" value="'+f.start+'" onchange="setMF(\'start\',this.value)"></div>'
  +'<div><label for="e">تاريخ النهاية (آخر دور)</label><input id="e" type="date" value="'+f.end+'" onchange="setMF(\'end\',this.value)"></div></div>'
  +'<label for="a">قسطي في كل دور (ج)</label><input id="a" inputmode="decimal" value="'+esc(f.amt)+'" placeholder="1000" oninput="setMF(\'amt\',this.value)">'
  +'<div id="mplan">'+mplanHTML()+'</div>'
  +'<p id="err" class="note bad" style="display:none;margin-top:14px"></p>'
  +'<button class="primary" style="width:100%;margin-top:14px" onclick="createM()">'+(g?'حفظ التعديلات':'حفظ الجمعية')+'</button>';
}
function createM(){
  var f=S.mf,e=document.getElementById("err"),name=f.name.trim();
  function fail(t){e.textContent=t;e.style.display="block";e.scrollIntoView({block:"center"})}
  if(!name)return fail("اكتب اسم الجمعية");
  var a=+digits(f.amt);if(!(a>0))return fail("اكتب قسطك في كل دور (رقم أكبر من صفر)");
  var per=periods(f.start,f.end,f.freq);if(!per.ok)return fail(per.msg);
  var rv=+digits(f.recv);if(!(rv>0))return fail("اكتب المبلغ اللي هتستلمه");
  var o={role:"member",name:name,manager:f.manager.trim(),freq:f.freq,start:f.start,end:f.end,R:per.R,myAmt:a,myRound:Math.min(f.round,per.R-1),recv:rv},cur=S.editId?get():null;
  if(cur){var np={};Object.keys(cur.paid).forEach(function(k){if(+k<per.R)np[k]=1});Object.keys(o).forEach(function(k){cur[k]=o[k]});cur.paid=np;save();go("detail",cur.id);return}
  o.id="g"+Date.now();o.paid={};o.received=false;S.list.unshift(o);save();go("detail",o.id);
}
function togglePaidM(r){var g=get();if(g.paid[r])delete g.paid[r];else g.paid[r]=1;save();render()}
function toggleRecM(){var g=get();g.received=!g.received;save();render()}
function detailM(g){
  var R=g.R,r=Math.min(S.round,R-1),my=g.myAmt,pc=0,isMy=r===g.myRound;
  for(var i=0;i<R;i++){if(g.paid[i])pc++}
  var pct=Math.round(pc/R*100);
  var h='<div class="top"><button class="ghost" onclick="go(\'home\')">رجوع</button></div>';
  h+='<section class="hero"><div class="hrow"><div><div class="hl">الدور '+nf(r+1)+' من '+nf(R)+' · '+fmt(dueDate(g,r))+'</div><h1 style="margin:2px 0 4px">'+esc(g.name)+'</h1><div class="hl">'+(g.manager?'المسؤول: '+esc(g.manager)+' · ':'')+(g.freq==="weekly"?"أسبوعي":"شهري")+' · تنتهي '+fmt(addP(g.start,g.freq,R-1))+'</div></div>'+ring(pct,84)+'</div>'
  +'<div class="hstats"><div><b>'+money(pc*my)+'</b><span>دفعته</span></div><div><b>'+money((R-pc)*my)+'</b><span>المتبقي عليّ</span></div><div><b>'+money(g.recv)+'</b><span>هستلم</span></div></div></section>';
  h+='<div class="steps">';
  for(var k=0;k<R;k++){h+='<button class="step'+(k===r?' on':'')+(g.paid[k]?' done':'')+(k===curRound(g)?' cur':'')+'" onclick="setRound('+k+')"><b>'+nf(k+1)+'</b><small>'+shortDate(dueDate(g,k))+'</small>'+(k===g.myRound?'<small style="display:block;font-weight:700">★ دوري</small>':'')+'</button>'}
  h+='</div><div class="sec"><span>الدور '+nf(r+1)+'</span></div>';
  h+='<button class="mem'+(g.paid[r]?' paid':'')+'" aria-pressed="'+(!!g.paid[r])+'" onclick="togglePaidM('+r+')"><span class="nm"><b>قسطي</b><span class="muted">'+money(my)+' · '+fmt(dueDate(g,r))+'</span></span><span class="pill '+(g.paid[r]?'ok':'warn')+'">'+(g.paid[r]?'دفعت ✓':'لسه')+'</span></button>';
  if(isMy)h+='<div class="rcard"><div class="nm"><b>ده دورك في الاستلام</b><span class="muted">هتستلم '+money(g.recv)+'</span></div><button class="tog'+(g.received?' on':'')+'" aria-pressed="'+(!!g.received)+'" onclick="toggleRecM()">'+(g.received?'استلمت ✓':'تأكيد الاستلام')+'</button></div>';
  h+='<div class="sec"><span>كل الأدوار</span></div><div class="scroll"><table class="tbl"><tr><th>الدور</th><th>التاريخ</th><th>القسط</th><th>الحالة</th></tr>';
  for(var j=0;j<R;j++){h+='<tr><td><b>'+nf(j+1)+'</b></td><td>'+fmt(dueDate(g,j))+(j===g.myRound?'<div class="muted">★ دوري: '+money(g.recv)+(g.received?' ✓':'')+'</div>':'')+'</td><td>'+money(my)+'</td><td>'+(g.paid[j]?'<span class="pill ok">دفعت</span>':'<span class="pill warn">لسه</span>')+'</td></tr>'}
  h+='<tr class="tot"><td>الإجمالي</td><td></td><td>'+money(my*R)+'</td><td>'+nf(pc)+' / '+nf(R)+'</td></tr></table></div>';
  return h+'<button class="ghost" style="width:100%;margin-top:18px" onclick="exportPdf(\'one\')">'+PDFI+' تصدير كشف الجمعية PDF</button><div class="acts" style="grid-template-columns:1fr auto;margin-top:10px"><button class="ghost" onclick="editMember()">تعديل</button><button class="danger" onclick="del()">حذف</button></div>';
}
/* theme */
var THEMES=[["gold","ذهبي","#D6B25E"],["emerald","زمردي","#3DD6A0"],["sapphire","أزرق","#5AA9FF"],["ruby","أحمر","#FF6B81"],["amethyst","بنفسجي","#B58CFF"],["copper","برتقالي","#FF9F5A"],["silver","فضي","#C8D0DC"]];
function setAccent(k){document.documentElement.setAttribute("data-accent",k);try{localStorage.setItem("gam3eya:accent",k)}catch(e){}drawThemes();if(S.view==="settings")render()}
function drawThemes(){var cur=document.documentElement.getAttribute("data-accent")||"gold";document.getElementById("themes").innerHTML='<span class="muted" style="align-self:center">لون التطبيق:</span>'+THEMES.map(function(t){return'<button class="th'+(t[0]===cur?' on':'')+'" style="--c:'+t[2]+'" aria-label="'+t[1]+'" aria-pressed="'+(t[0]===cur)+'" onclick="setAccent(\''+t[0]+'\')"></button>'}).join("")}
function toggleThemes(){document.getElementById("themes").classList.toggle("open")}
var SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function drawMode(){var m=document.documentElement.getAttribute("data-mode")||"dark",b=document.getElementById("modeb");b.setAttribute("aria-label",m==="dark"?"التحويل للوضع الفاتح":"التحويل للوضع الداكن");b.innerHTML=m==="dark"?SUN:MOON}
function setMode(m){document.documentElement.setAttribute("data-mode",m);try{localStorage.setItem("gam3eya:mode",m)}catch(e){}drawMode();if(S.view==="settings")render()}
function toggleMode(){setMode((document.documentElement.getAttribute("data-mode")||"dark")==="dark"?"light":"dark")}
function initTheme(){var md="dark";try{md=localStorage.getItem("gam3eya:mode")==="light"?"light":"dark"}catch(e){}document.documentElement.setAttribute("data-mode",md);drawMode();var k="gold";try{k=localStorage.getItem("gam3eya:accent")||"gold"}catch(e){}if(!THEMES.some(function(t){return t[0]===k}))k="gold";document.documentElement.setAttribute("data-accent",k);drawThemes()}
/* backup */
function backupData(){return JSON.stringify({app:"gam3eya",v:3,at:new Date().toISOString(),groups:S.list,wallet:S.wallet})}
function fallbackDl(txt,fn){try{var b=new Blob([txt],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast("جاري تنزيل الملف. لو ما نزلش استخدم «نسخ كنص»")}catch(e){toast("التنزيل مش متاح هنا، استخدم «نسخ كنص»")}}
function backupFile(){
  var txt=backupData(),fn="gam3eya-backup-"+iso(new Date())+".json";

function validG(g){

  var D=/^\d{4}-\d{2}-\d{2}$/;
  if(!D.test(g.start||"")||(g.freq!=="monthly"&&g.freq!=="weekly")||!g.paid||typeof g.paid!=="object")return false;
  if(g.role==="member")return g.myAmt>0&&g.recv>0&&Number.isInteger(g.R)&&g.R>=2&&Number.isInteger(g.myRound)&&g.myRound>=0&&g.myRound<g.R&&D.test(g.end||"");
  if(!Array.isArray(g.members)||!Array.isArray(g.turns)||!g.turns.length||!g.received||typeof g.received!=="object")return false;
  for(var i=0;i<g.members.length;i++){var m=g.members[i];if(!m||typeof m.name!=="string"||!(m.amt>0))return false}
  for(var r=0;r<g.turns.length;r++){if(!Array.isArray(g.turns[r])||!g.turns[r].length)return false;for(var k=0;k<g.turns[r].length;k++){var x=g.turns[r][k];if(!Number.isInteger(x)||x<0||x>=g.members.length)return false}}
  return true;
}

function digits(s){return String(s).replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/٫|،/g,".")}
function pad(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addP(s,fr,k){var a=s.split("-"),y=+a[0],m=+a[1]-1,d=+a[2];if(fr==="weekly")return new Date(y,m,d+7*k);var t=new Date(y,m+k,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return t}
function periods(s,e,fr){
  if(!s||!e)return{ok:false,msg:"حدد تاريخ البداية وتاريخ النهاية"};
  var sd=new Date(s+"T00:00:00"),ed=new Date(e+"T00:00:00");
  if(ed<=sd)return{ok:false,msg:"تاريخ النهاية لازم يكون بعد تاريخ البداية"};
  var mf;if(fr==="weekly"){mf=Math.floor(Math.round((ed-sd)/864e5)/7)}else{mf=(ed.getFullYear()-sd.getFullYear())*12+ed.getMonth()-sd.getMonth();if(addP(s,fr,mf)>ed)mf--}
  var c1=addP(s,fr,mf);
  if(iso(c1)===e){if(mf<1)return{ok:false,msg:"المدة أقصر من دورين، مد تاريخ النهاية"};return{ok:true,R:mf+1}}
  var o=[];if(mf>=1)o.push(fmt(c1));o.push(fmt(addP(s,fr,mf+1)));
  return{ok:false,msg:"المدة من "+fmt(sd)+" إلى "+fmt(ed)+" مش بتتقسم على أدوار "+(fr==="weekly"?"أسبوعية":"شهرية")+" كاملة، فالجمعية مش هتقبل كده. عدّل تاريخ النهاية إلى "+o.join(" أو ")+"."}
}
function alloc(list,R){
  var P=list.reduce(function(a,m){return a+Math.round(m.amt*100)},0),rem=list.map(function(m){return Math.round(m.amt*100)*R}),turns=[],shares=[],i=0;
  for(var r=0;r<R;r++){var left=P,ids=[],sh=[];
    while(left>0&&i<list.length){var t=Math.min(left,rem[i]);if(t>0){ids.push(i);sh.push(t/100);left-=t;rem[i]-=t}if(rem[i]===0)i++}
    turns.push(ids);shares.push(sh)}
  return{turns:turns,shares:shares}
}

    if(!nm&&!String(m.amt).trim())continue;

function create(){
  var f=S.fm,e=document.getElementById("err"),name=f.name.trim();
  function fail(t){e.textContent=t;e.style.display="block";e.scrollIntoView({block:"center"})}
  if(!name)return fail("اكتب اسم الجمعية");
  var mem=readMembers();if(mem.err)return fail(mem.err);
  var list=mem.list,uidx={};mem.uids.forEach(function(u,i){uidx[u]=i});
  if(list.length<2)return fail("لازم عضوين على الأقل");
  var per=periods(f.start,f.end,f.freq);if(!per.ok)return fail(per.msg);
  var R=per.R,P=Math.round(list.reduce(function(a,m){return a+m.amt*100},0))/100,turns,shares;
  if(!S.te){var a=alloc(list,R);turns=a.turns;shares=a.shares}
  else{
    turns=[];shares=[];
    for(var r=0;r<f.turns.length;r++){
      var t=f.turns[r],ids=[],sh=[];
      for(var k=0;k<t.length;k++){var x=t[k];
        if(x.m==null||uidx[x.m]==null)return fail("اختار المستلم في الدور "+nf(r+1));
        if(ids.indexOf(uidx[x.m])>-1)return fail("«"+list[uidx[x.m]].name+"» مكرر جوه الدور "+nf(r+1));
        ids.push(uidx[x.m]);var am=String(x.amt).trim();
        if(am&&!(+digits(am)>0))return fail("مبلغ غير صحيح في الدور "+nf(r+1));
        sh.push(am?+digits(am):null)}
      var fixed=sh.reduce(function(a,v){return a+(v||0)},0),free=sh.filter(function(v){return v==null}).length;
      if(fixed>P+0.001)return fail("مبالغ الدور "+nf(r+1)+" ("+nf(fixed)+") أكبر من قيمة الدور "+nf(P));
      if(free){var left=Math.round((P-fixed)*100),each=Math.floor(left/free),seenFree=0;
        sh=sh.map(function(v){if(v!=null)return v;seenFree++;return(seenFree===free?left-each*(free-1):each)/100})}
      var sum=sh.reduce(function(a,v){return a+v},0);
      if(Math.abs(sum-P)>0.001)return fail("مجموع مبالغ الدور "+nf(r+1)+" هو "+nf(sum)+" والمفروض "+nf(P)+" (قيمة الدور)");
      turns.push(ids);shares.push(sh)}
    if(turns.length!==R)return fail("عدد الأدوار "+nf(turns.length)+" ومدة الجمعية محتاجة "+nf(R)+" دور. عدّل الأدوار أو التواريخ.");
    var got=list.map(function(){return 0});
    turns.forEach(function(t,r){t.forEach(function(ix,k){got[ix]+=shares[r][k]})});
    for(var q=0;q<list.length;q++){var due=Math.round(list[q].amt*R*100)/100;
      if(Math.abs(got[q]-due)>0.01)return fail("الجمعية مش هتقبل كده: «"+list[q].name+"» هيدفع "+nf(due)+" ("+nf(list[q].amt)+" × "+nf(R)+") لكن هيستلم "+nf(got[q])+". لازم يستلم بالظبط اللي بيدفعه، عدّل الأدوار.")}
  }
  var cur=S.editId?get():null;
  if(cur){
    var old=cur.members,map={},usedNew={};

  if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript(["lib/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]);
}
function pStat(l,v){return'<div class="p-stat"><span>'+l+'</span><b>'+v+'</b></div>'}
function pHead(g,role,sub){return'<div class="p-head"><div><div class="p-brand">جمعيتي · كشف جمعية</div><div class="p-title">'+esc(g.name)+'</div><div class="p-brand">'+role+' · '+sub+'</div></div><div class="p-brand" style="text-align:left">'+fmt(new Date())+'</div></div>'}
function pFoot(){return'<div class="p-foot"><span>تصميم: حسام رضوان — 01000094992</span><span>جمعيتي</span></div>'}
function pdfGroupHTML(g){
  var R=nR(g),t=new Date();t.setHours(0,0,0,0);var h='<div class="pd">',i,k,r;
  if(g.role==="member"){
    var pc=0;for(i=0;i<R;i++){if(g.paid[i])pc++}

    h+='<div class="p-stats">'+pStat("قسطي في كل دور",money(g.myAmt))+pStat("عدد الأدوار",nf(R))+pStat("دفعته",money(pc*g.myAmt))+pStat("المتبقي عليّ",money((R-pc)*g.myAmt))+'</div>';
    h+='<div class="p-h">جدول الأقساط</div><table class="p-t"><tr><th>الدور</th><th>التاريخ</th><th>القسط</th><th>الحالة</th></tr>';
    for(r=0;r<R;r++){h+='<tr><td>'+nf(r+1)+'</td><td>'+fmt(dueDate(g,r))+(r===g.myRound?'<div><b>★ دوري: '+money(g.recv)+(g.received?' (تم الاستلام)':'')+'</b></div>':'')+'</td><td>'+money(g.myAmt)+'</td><td class="'+(g.paid[r]?'p-ok':'p-no')+'">'+(g.paid[r]?'دفعت':(dueDate(g,r)<t?'متأخر':'لسه'))+'</td></tr>'}
    h+='<tr class="t"><td colspan="2">الإجمالي</td><td>'+money(g.myAmt*R)+'</td><td>'+nf(pc)+' / '+nf(R)+'</td></tr></table>';
    return h+pFoot()+'</div>';
  }
  var n=g.members.length,p=pot(g),cr=curRound(g);
  h+=pHead(g,"مسؤول",(g.freq==="weekly"?"أسبوعي":"شهري")+' · من '+fmt(new Date(g.start+"T00:00:00"))+' إلى '+fmt(addP(g.start,g.freq,R-1)));
  h+='<div class="p-stats">'+pStat("قيمة الدور",money(p))+pStat("عدد الأعضاء",nf(n))+pStat("عدد الأدوار",nf(R))+pStat("محصّل الدور "+nf(cr+1),money(paidSum(g,cr))+' / '+money(p))+'</div>';
  h+='<div class="p-h">الأعضاء والأقساط</div><table class="p-t"><tr><th>#</th><th>العضو</th><th>القسط</th><th>الاستلام</th><th>مدفوع</th><th>المتبقي</th></tr>';
  var TA=0,TP=0,TR=0;
  g.members.forEach(function(m,i){var c=0,rs=[],tot=0,q,kk;for(q=0;q<R;q++){if(g.paid[q+"-"+i])c++}
    for(q=0;q<R;q++){g.turns[q].forEach(function(ix,kx){if(ix===i){var s=shareOf(g,q,kx);rs.push(fmt(dueDate(g,q))+(g.received[q+"-"+i]?' ✓':'')+' — '+money(s));tot+=s}})}
    TA+=m.amt;TP+=c*m.amt;TR+=(R-c)*m.amt;
    h+='<tr><td>'+nf(i+1)+'</td><td><b>'+esc(m.name)+'</b></td><td>'+money(m.amt)+'</td><td>'+rs.join('<br>')+'<div><b>إجمالي '+money(tot)+'</b></div></td><td>'+money(c*m.amt)+'</td><td>'+money((R-c)*m.amt)+'</td></tr>'});
  h+='<tr class="t"><td colspan="2">الإجمالي</td><td>'+money(TA)+'</td><td></td><td>'+money(TP)+'</td><td>'+money(TR)+'</td></tr></table>';
  h+='<div class="p-h">جدول الأدوار</div><table class="p-t"><tr><th>الدور</th><th>التاريخ</th><th>المستلم والمبلغ</th><th>المحصّل</th><th>الحالة</th></tr>';
  for(r=0;r<R;r++){var pcnt=paidCount(g,r),ok=pcnt===n;
    h+='<tr><td>'+nf(r+1)+'</td><td>'+fmt(dueDate(g,r))+'</td><td>'+g.turns[r].map(function(ix,kx){return esc(g.members[ix].name)+' — '+money(shareOf(g,r,kx))+(g.received[r+"-"+ix]?' ✓':'')}).join('<br>')+'</td><td>'+money(paidSum(g,r))+'</td><td class="'+(ok?'p-ok':'p-no')+'">'+(ok?'مكتمل':(dueDate(g,r)>t?'قادم':'ناقص '+nf(n-pcnt)))+'</td></tr>'}
  h+='</table>';
  if(R<=14){h+='<div class="p-h">جدول الدفعات</div><table class="p-t mx"><tr><th>العضو</th>';for(r=0;r<R;r++)h+='<th>'+nf(r+1)+'</th>';h+='</tr>';
    g.members.forEach(function(m,i){h+='<tr><td>'+esc(m.name)+'</td>';for(var q=0;q<R;q++)h+='<td class="'+(g.paid[q+"-"+i]?'p-ok':'')+'">'+(g.paid[q+"-"+i]?'✓':'·')+'</td>';h+='</tr>'});h+='</table>'}
  return h+pFoot()+'</div>';
}
async function makePdf(list){
  await pdfLibs();if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",compression:true}),first=true,root=document.getElementById("pdfroot");S.pdf=true;
  try{
    for(var gi=0;gi<list.length;gi++){
      root.innerHTML=list[gi].wallet?pdfWalletHTML(list[gi].wallet):pdfGroupHTML(list[gi]);
      var cv=await window.html2canvas(root,{scale:2,backgroundColor:"#ffffff",useCORS:true}),ratio=cv.width/210,ph=Math.floor(297*ratio);
      for(var y=0;y<cv.height;y+=ph){var h=Math.min(ph,cv.height-y),pc=document.createElement("canvas");pc.width=cv.width;pc.height=h;pc.getContext("2d").drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
        if(!first)doc.addPage();first=false;doc.addImage(pc.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,h/ratio)}
    }
  }finally{S.pdf=false;root.innerHTML=""}
  return doc.output("blob");
}
function blobB64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=rej;r.readAsDataURL(b)})}
async function savePdf(blob,fn){
  var c=window.Capacitor,Pl=c&&c.Plugins;
  if(Pl&&Pl.Filesystem&&Pl.Share&&c.isNativePlatform&&c.isNativePlatform()){
    var w=await Pl.Filesystem.writeFile({path:fn,data:await blobB64(blob),directory:"CACHE"});
    await Pl.Share.share({title:fn,url:w.uri,dialogTitle:"فتح أو مشاركة الكشف"});return;
  }
  if(window.claude&&window.claude.use){try{var d=await window.claude.use("downloads");if(d){await d.save({filename:fn,data:blob});toast("تم حفظ ملف الـ PDF");return}}catch(e){if(e&&e.code==="declined")return}}
  var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},8000);toast("جاري تنزيل الـ PDF");
}
async function exportPdf(which){
  if(S.pdfBusy)return;var list=which==="all"?S.list:which==="wallet"?[{wallet:S.wm}]:[get()].filter(Boolean);
  if(!list.length)return toast("مفيش جمعيات للتصدير");
  S.pdfBusy=true;toast("جاري تجهيز الـ PDF...");
  try{var blob=await makePdf(list);await savePdf(blob,"gam3eya-"+(which==="all"?"all":which==="wallet"?"wallet-"+S.wm:list[0].id)+"-"+iso(new Date())+".pdf")}
  catch(e){toast("تعذّر إنشاء الـ PDF، اتأكد من الاتصال بالإنترنت وجرب تاني")}
  S.pdfBusy=false;
}

/* ===== wallet ===== */
var WK="gam3eya:wallet",KM={income:{l:"دخل",s:1,c:"in",g:"+"},expense:{l:"مصروف",s:-1,c:"out",g:"−"},salary_out:{l:"مرتب مدفوع",s:-1,c:"sal",g:"−"},salary_in:{l:"مرتب مستلم",s:1,c:"sal",g:"+"}};
var EXP=["طعام","مواصلات","فواتير","إيجار","صحة","تعليم","ترفيه","مشتريات","أخرى"],INC=["مبيعات","أرباح","هدية","أخرى"];
S.wallet=[];S.wm=iso(new Date()).slice(0,7);S.wf="all";
function validTx(t){return!!t&&typeof t==="object"&&typeof t.id==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(t.id)&&KM.hasOwnProperty(t.kind)&&typeof t.amount==="number"&&isFinite(t.amount)&&t.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||"")&&typeof t.cat==="string"&&t.cat.length<=60&&typeof t.note==="string"&&t.note.length<=200}
function loadW(){try{var r=JSON.parse(localStorage.getItem(WK)||"[]");if(Array.isArray(r))S.wallet=r.filter(validTx)}catch(e){}}
function saveW(){try{localStorage.setItem(WK,JSON.stringify(S.wallet))}catch(e){}}
function monthLabel(m){var a=m.split("-");return new Date(+a[0],+a[1]-1,1).toLocaleDateString("ar-EG",{month:"long",year:"numeric"})}
function shiftMonth(d){var a=S.wm.split("-"),dt=new Date(+a[0],+a[1]-1+d,1);S.wm=dt.getFullYear()+"-"+pad(dt.getMonth()+1);render()}
function wsum(l){var r={inc:0,exp:0,sal:0,net:0};l.forEach(function(t){if(t.kind==="income"||t.kind==="salary_in")r.inc+=t.amount;else if(t.kind==="expense")r.exp+=t.amount;else r.sal+=t.amount;r.net+=KM[t.kind].s*t.amount});r.net=Math.round(r.net*100)/100;return r}
function byDate(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)}
function monthTx(m){return S.wallet.filter(function(t){return t.date.slice(0,7)===m})}
function outCats(l){var mp={},sal=0;l.forEach(function(t){if(t.kind==="expense")mp[t.cat||"أخرى"]=(mp[t.cat||"أخرى"]||0)+t.amount;else if(t.kind==="salary_out")sal+=t.amount});
  var a=Object.keys(mp).map(function(k){return{n:k,v:mp[k]}});if(sal)a.push({n:"مرتبات مدفوعة",v:sal});return a.sort(function(x,y){return y.v-x.v})}
function tabsHTML(a){return'<div class="tabs" role="tablist"><button class="tab'+(a==="home"?' on':'')+'" role="tab" aria-selected="'+(a==="home")+'" onclick="go(\'home\')">الجمعيات</button><button class="tab'+(a==="wallet"?' on':'')+'" role="tab" aria-selected="'+(a==="wallet")+'" onclick="go(\'wallet\')">المحفظة</button></div>'}
function setWF(f){S.wf=f;render()}
function walletView(){
  var ml=monthTx(S.wm),m=wsum(ml),tot=wsum(S.wallet).net;
  var h=tabsHTML("wallet")+'<div class="mnav"><button class="ghost" aria-label="الشهر السابق" onclick="shiftMonth(-1)">›</button><b>'+monthLabel(S.wm)+'</b><button class="ghost" aria-label="الشهر التالي" onclick="shiftMonth(1)">‹</button></div>';
  h+='<section class="hero"><div class="hl">صافي الشهر</div><div class="big"'+(m.net<0?' style="color:var(--bad)"':'')+'>'+(m.net<0?'−':'')+money(Math.abs(m.net))+'</div>'
  +'<div class="hstats"><div><b>'+money(m.inc)+'</b><span>دخل</span></div><div><b>'+money(m.exp)+'</b><span>مصروفات</span></div><div><b>'+money(m.sal)+'</b><span>مرتبات مدفوعة</span></div></div>'
  +'<div class="hl" style="margin-top:12px;position:relative;z-index:1">الرصيد الكلي: <b style="color:var(--ink)">'+(tot<0?'−':'')+money(Math.abs(tot))+'</b></div></section>';
  var oc=outCats(ml),ot=m.exp+m.sal;
  if(oc.length){h+='<div class="sec"><span>المصروفات حسب البند</span></div><div class="card" style="box-shadow:none;padding:6px 16px">';
    oc.slice(0,6).forEach(function(c){h+='<div class="cb"><div class="row"><span>'+esc(c.n)+'</span><b>'+money(c.v)+'</b></div><div class="bar" style="background:var(--line)"><i style="width:'+(c.v/ot*100)+'%"></i></div></div>'});h+='</div>'}
  h+='<div class="sec"><span>المعاملات</span>'+(ml.length?'<button class="linkbtn" style="margin:0" onclick="exportPdf(\'wallet\')">'+PDFI+' كشف الشهر PDF</button>':'')+'</div>';
  h+='<div class="seg3">'+[["all","الكل"],["income","دخل"],["expense","مصروف"],["salary","مرتبات"]].map(function(f){return'<button class="chipb'+(S.wf===f[0]?' on':'')+'" onclick="setWF(\''+f[0]+'\')">'+f[1]+'</button>'}).join("")+'</div>';
  var l=ml.filter(function(t){return S.wf==="all"||(S.wf==="income"&&t.kind==="income")||(S.wf==="expense"&&t.kind==="expense")||(S.wf==="salary"&&(t.kind==="salary_in"||t.kind==="salary_out"))}).sort(byDate);
  if(!l.length)h+='<div class="empty"><h2>مفيش معاملات</h2><p style="margin:0">اضغط «+ معاملة» عشان تسجّل دخل أو مصروف أو مرتب.</p></div>';
  var last="";
  l.forEach(function(t){var k=KM[t.kind];
    if(t.date!==last){last=t.date;h+='<div class="dayh">'+fmt(new Date(t.date+"T00:00:00"))+'</div>'}
    h+='<button class="tx" onclick="editTx(\''+t.id+'\')"><span class="ic '+k.c+'">'+k.g+'</span><span class="nm"><b>'+esc(t.cat||k.l)+'</b><span class="muted">'+k.l+(t.note?' · '+esc(t.note):'')+'</span></span><b class="amt '+(k.s>0?'in':'out')+'">'+(k.s>0?'+':'−')+money(t.amount)+'</b></button>'});
  return h+'<button class="primary fab" onclick="go(\'wtx\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>معاملة</button>';
}
function initTF(t){S.tf=t?{id:t.id,kind:t.kind,amt:String(t.amount),cat:t.cat,date:t.date,note:t.note}:{id:null,kind:"expense",amt:"",cat:EXP[0],date:iso(new Date()),note:""}}
function editTx(id){var t=S.wallet.find(function(x){return x.id===id});if(!t)return;initTF(t);S.view="wtx";render();window.scrollTo(0,0)}
function setKind(k){var f=S.tf;f.kind=k;f.cat=k==="expense"?EXP[0]:k==="income"?INC[0]:"";render()}
function wtxView(){
  var f=S.tf,sal=f.kind==="salary_in"||f.kind==="salary_out",ed=!!f.id;
  var h='<div class="top"><button class="ghost" onclick="go(\'wallet\')">رجوع</button></div><h1>'+(ed?'تعديل معاملة':'معاملة جديدة')+'</h1><div class="seg" role="group" aria-label="نوع المعاملة">'
  +Object.keys(KM).map(function(k){return'<button class="k-'+KM[k].c+(f.kind===k?' on':'')+'" aria-pressed="'+(f.kind===k)+'" onclick="setKind(\''+k+'\')">'+KM[k].l+'</button>'}).join("")+'</div>';
  h+='<label for="wa">المبلغ (ج)</label><input id="wa" inputmode="decimal" value="'+esc(f.amt)+'" placeholder="0" oninput="S.tf.amt=this.value">';
  if(sal){
    var nm={};S.wallet.forEach(function(t){if(t.kind===f.kind&&t.cat)nm[t.cat]=1});
    h+='<label for="wc">'+(f.kind==="salary_out"?'اسم الموظف':'جهة العمل')+'</label><input id="wc" list="wnames" value="'+esc(f.cat)+'" placeholder="'+(f.kind==="salary_out"?'مثال: محمد أحمد':'مثال: الشركة')+'" oninput="S.tf.cat=this.value"><datalist id="wnames">'+Object.keys(nm).map(function(n){return'<option value="'+esc(n)+'"></option>'}).join("")+'</datalist>';
  }else{
    var lst=(f.kind==="expense"?EXP:INC).slice();if(f.cat&&lst.indexOf(f.cat)<0)lst.unshift(f.cat);
    h+='<label for="wc">البند</label><select id="wc" onchange="S.tf.cat=this.value">'+lst.map(function(c){return'<option'+(c===f.cat?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select>';
  }
  h+='<label for="wd">التاريخ</label><input id="wd" type="date" value="'+f.date+'" onchange="S.tf.date=this.value"><label for="wn">ملاحظة (اختياري)</label><input id="wn" maxlength="200" value="'+esc(f.note)+'" oninput="S.tf.note=this.value">'
  +'<p id="err" class="note bad" style="display:none;margin-top:14px"></p><button class="primary" style="width:100%;margin-top:16px" onclick="saveTx()">'+(ed?'حفظ التعديلات':'حفظ المعاملة')+'</button>';
  if(ed)h+='<div class="two" style="margin-top:10px"><button class="ghost" onclick="dupTx()">تكرار بتاريخ النهارده</button><button class="danger" onclick="delTx()">حذف</button></div>';
  return h;
}
function saveTx(){
  var f=S.tf,e=document.getElementById("err"),a=+digits(f.amt);
  function fail(t){e.textContent=t;e.style.display="block";e.scrollIntoView({block:"center"})}
  if(!(a>0))return fail("اكتب مبلغ أكبر من صفر");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||""))return fail("اختار تاريخ صحيح");
  var cat=String(f.cat||"").trim().slice(0,60),sal=f.kind==="salary_in"||f.kind==="salary_out";
  if(sal&&!cat)return fail(f.kind==="salary_out"?"اكتب اسم الموظف":"اكتب جهة العمل");
  var t={id:f.id||"w"+Date.now()+Math.floor(Math.random()*1000),kind:f.kind,amount:Math.round(a*100)/100,cat:cat,date:f.date,note:String(f.note||"").trim().slice(0,200)};
  var i=S.wallet.findIndex(function(x){return x.id===t.id});if(i>-1)S.wallet[i]=t;else S.wallet.push(t);
  saveW();S.wm=t.date.slice(0,7);go("wallet");toast("تم الحفظ");
}
function dupTx(){var f=S.tf,t=S.wallet.find(function(x){return x.id===f.id});if(!t)return;var n=Object.assign({},t,{id:"w"+Date.now()+Math.floor(Math.random()*1000),date:iso(new Date())});S.wallet.push(n);saveW();S.wm=n.date.slice(0,7);go("wallet");toast("تم التكرار بتاريخ النهارده")}
function delTx(){confirm2("dtx","اضغط حذف تاني لتأكيد مسح المعاملة",function(){S.wallet=S.wallet.filter(function(x){return x.id!==S.tf.id});saveW();go("wallet")})}
function pdfWalletHTML(m){
  var ml=monthTx(m).sort(byDate).reverse(),s=wsum(ml),oc=outCats(ml),ot=s.exp+s.sal;
  var h='<div class="pd"><div class="p-head"><div><div class="p-brand">جمعيتي · المحفظة</div><div class="p-title">كشف حساب '+monthLabel(m)+'</div></div><div class="p-brand">'+fmt(new Date())+'</div></div>'
  +'<div class="p-stats">'+pStat("صافي الشهر",(s.net<0?'−':'')+money(Math.abs(s.net)))+pStat("الدخل",money(s.inc))+pStat("المصروفات",money(s.exp))+pStat("مرتبات مدفوعة",money(s.sal))+'</div>';
  if(oc.length){h+='<div class="p-h">المصروفات حسب البند</div><table class="p-t"><tr><th>البند</th><th>المبلغ</th><th>النسبة</th></tr>'+oc.map(function(c){return'<tr><td>'+esc(c.n)+'</td><td>'+money(c.v)+'</td><td>'+nf(Math.round(c.v/ot*100))+'٪</td></tr>'}).join("")+'</table>'}
  h+='<div class="p-h">المعاملات</div><table class="p-t"><tr><th>التاريخ</th><th>النوع</th><th>البند</th><th>ملاحظة</th><th>المبلغ</th></tr>';
  ml.forEach(function(t){var k=KM[t.kind];h+='<tr><td>'+fmt(new Date(t.date+"T00:00:00"))+'</td><td>'+k.l+'</td><td>'+esc(t.cat)+'</td><td>'+esc(t.note)+'</td><td class="'+(k.s>0?'p-ok':'p-no')+'">'+(k.s>0?'+':'−')+money(t.amount)+'</td></tr>'});
  if(!ml.length)h+='<tr><td colspan="5">لا توجد معاملات</td></tr>';
  h+='<tr class="t"><td colspan="4">الصافي</td><td>'+(s.net<0?'−':'')+money(Math.abs(s.net))+'</td></tr></table>';
  return h+pFoot()+'</div>';
}
