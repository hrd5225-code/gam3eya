name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  # اكتب false لو عايز تقدر تاخد لقطة شاشة من التطبيق
  SECURE_SCREEN: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Bundle fonts and PDF libraries (work offline)
        run: |
          mkdir -p www/lib www/fonts
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          for w in 400 500 600 700; do cp node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-arabic-$w-normal.woff2 www/fonts/; done
          for w in 400 600 700; do cp node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-latin-$w-normal.woff2 www/fonts/; done
      - run: npx cap add android
      - name: Android permissions and screen protection
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          if [ "$SECURE_SCREEN" = "true" ]; then
          cat > android/app/src/main/java/com/hossam/gam3eya/MainActivity.java <<'JAVA'
          package com.hossam.gam3eya;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
            }
          }
          JAVA
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gam3eya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
